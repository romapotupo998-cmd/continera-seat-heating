
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111315">

<title>Continera Seat Heating</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #111315;
  color: #e8e8e8;
  font-family: Arial, sans-serif;
  padding: 20px;
}

.container {
  max-width: 430px;
  margin: auto;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 45px;
}

.logo {
  font-size: 19px;
  font-weight: bold;
  letter-spacing: 2px;
}

.connection {
  color: #42c5a8;
  font-size: 11px;
  border: 1px solid #286b5d;
  padding: 6px 10px;
  border-radius: 20px;
}

h1 {
  text-align: center;
  font-size: 25px;
  letter-spacing: 2px;
  margin-bottom: 8px;
}

.subtitle {
  text-align: center;
  color: #92999d;
  font-size: 12px;
  letter-spacing: 2px;
  margin-bottom: 25px;
}

.seat-card {
  background: #202629;
  border-radius: 20px;
  padding: 30px 20px;
  text-align: center;
  margin-bottom: 30px;
}

.control-area {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 17px;
}

.control-label {
  color: #92999d;
  font-size: 11px;
  letter-spacing: 2px;
}

.heater-control {
  position: relative;
  width: 150px;
  height: 150px;
  border-radius: 50%;
  border: 5px solid #30383b;
  background: linear-gradient(145deg, #343c40, #171c1f);
  box-shadow:
    0 8px 18px #0008,
    inset 0 2px 5px #ffffff12,
    inset 0 -5px 10px #0008;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  transition: border-color .2s, box-shadow .2s;
}

.heater-control:active {
  transform: scale(.97);
}

.heater-control.active {
  border-color: #42c5a8;
  box-shadow:
    0 0 15px #42c5a833,
    inset 0 2px 5px #ffffff12,
    inset 0 -5px 10px #0008;
}

.heater-icon {
  width: 65px;
  height: 75px;
  color: #92999d;
  transition: color .2s;
}

.heater-control.active .heater-icon {
  color: #42c5a8;
}

.heater-icon svg {
  width: 100%;
  height: 100%;
}

.indicators {
  position: absolute;
  inset: 10px;
  border-radius: 50%;
  pointer-events: none;
}

.indicator {
  position: absolute;
  width: 4px;
  height: 9px;
  background: #626b6e;
  border-radius: 3px;
  left: 50%;
  top: 0;
  transform-origin: 2px 60px;
}

.indicator:nth-child(1) {
  transform: rotate(-55deg);
}

.indicator:nth-child(2) {
  transform: rotate(-27deg);
}

.indicator:nth-child(3) {
  transform: rotate(0deg);
}

.indicator:nth-child(4) {
  transform: rotate(27deg);
}

.indicator:nth-child(5) {
  transform: rotate(55deg);
}

.indicator.active {
  background: #42c5a8;
  box-shadow: 0 0 6px #42c5a8;
}

.level-display {
  font-size: 28px;
  font-weight: bold;
  color: #aab2b5;
}

.level-display.active {
  color: #42c5a8;
}

.status-text {
  color: #92999d;
  font-size: 13px;
}

.info {
  border-top: 1px solid #30383b;
  padding-top: 20px;
}

.info-row {
  display: flex;
  justify-content: space-between;
  margin-bottom: 18px;
  font-size: 13px;
}

.info-label {
  color: #92999d;
}

.info-value {
  font-weight: bold;
}

footer {
  text-align: center;
  color: #687477;
  font-size: 11px;
  letter-spacing: 2px;
  margin-top: 55px;
}
</style>
</head>

<body>

<div class="container">

  <header>
    <div class="logo">CONTINERA</div>
    <div class="connection">CONNECTED</div>
  </header>

  <h1>SEAT HEATING</h1>
  <div class="subtitle">DRIVER SEAT</div>

  <div class="seat-card">

    <div class="control-area">

      <div class="control-label">
        SEAT HEATING CONTROL
      </div>

      <button
        class="heater-control"
        id="heaterControl"
        aria-label="Seat heating control"
        type="button"
      >

        <div class="indicators">
          <span class="indicator"></span>
          <span class="indicator"></span>
          <span class="indicator"></span>
          <span class="indicator"></span>
          <span class="indicator"></span>
        </div>

        <div class="heater-icon">
          <svg viewBox="0 0 80 90"
               fill="none"
               stroke="currentColor"
               stroke-width="4"
               stroke-linecap="round"
               stroke-linejoin="round">

            <path d="M25 38 L25 12
                     Q25 7 30 7
                     Q35 7 35 12
                     L35 38"/>

            <path d="M25 38
                     L52 38
                     L60 72
                     L17 72
                     L17 54
                     Q17 45 25 38Z"/>

            <path d="M27 52 L48 52"/>

            <path d="M12 22
                     Q5 15 12 8"/>

            <path d="M68 22
                     Q75 15 68 8"/>

          </svg>
        </div>

      </button>

      <div class="level-display" id="levelDisplay">
        OFF
      </div>

      <div class="status-text" id="statusText">
        Heating inactive
      </div>

      <div class="control-label">
        TAP TO CHANGE LEVEL
      </div>

    </div>

  </div>

  <div class="info">

    <div class="info-row">
      <span class="info-label">STATUS</span>
      <span class="info-value" id="statusValue">
        INACTIVE
      </span>
    </div>

    <div class="info-row">
      <span class="info-label">HEATING LEVEL</span>
      <span class="info-value" id="levelValue">
        0
      </span>
    </div>

    <div class="info-row">
      <span class="info-label">SEAT</span>
      <span class="info-value">DRIVER</span>
    </div>

  </div>

  <footer>CONTINERA SYSTEMS</footer>

</div>

<script>
const heaterControl = document.getElementById("heaterControl");
const levelDisplay = document.getElementById("levelDisplay");
const statusText = document.getElementById("statusText");
const statusValue = document.getElementById("statusValue");
const levelValue = document.getElementById("levelValue");
const indicators = document.querySelectorAll(".indicator");

let currentLevel = Number(
  localStorage.getItem("contineraSeatHeating") || 0
);

function updateHeating(level) {
  currentLevel = level;

  const active = level > 0;

  levelDisplay.textContent =
    active ? "LEVEL " + level : "OFF";

  levelDisplay.classList.toggle("active", active);

  statusText.textContent =
    active ? "Heating active" : "Heating inactive";

  statusValue.textContent =
    active ? "ACTIVE" : "INACTIVE";

  levelValue.textContent = level;

  heaterControl.classList.toggle("active", active);

  indicators.forEach((indicator, index) => {
    indicator.classList.toggle(
      "active",
      active && index < level + 1
    );
  });

  localStorage.setItem(
    "contineraSeatHeating",
    level
  );
}

heaterControl.addEventListener("click", () => {
  const nextLevel = (currentLevel + 1) % 4;
  updateHeating(nextLevel);
});

if (
  !Number.isInteger(currentLevel) ||
  currentLevel < 0 ||
  currentLevel > 3
) {
  currentLevel = 0;
}

updateHeating(currentLevel);
</script>

</body>
</html>
