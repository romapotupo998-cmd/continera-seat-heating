
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111315">
<title>Continera Seat Heating</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px;
  background: #111315;
  color: #e8e8e8;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 520px;
  margin: auto;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 45px;
}

.logo {
  font-size: 19px;
  font-weight: bold;
  letter-spacing: 2px;
}

.connection {
  color: #42c5a8;
  border: 1px solid #286b5d;
  padding: 6px 10px;
  border-radius: 20px;
  font-size: 11px;
}

h1 {
  text-align: center;
  font-size: 24px;
  letter-spacing: 2px;
  margin-bottom: 8px;
}

.subtitle {
  text-align: center;
  color: #92999d;
  font-size: 12px;
  letter-spacing: 2px;
  margin-bottom: 30px;
}

/* Вся панель */

.panel-frame {
  width: 100%;
  padding: 12px 7px;
  border-radius: 12px;
  background: linear-gradient(145deg,#343a3d,#171c1f);
  box-shadow: 0 12px 30px #0008;
}

.panel {
  display: grid;
  grid-template-columns: 48px minmax(0,1fr) 38px 83px;
  align-items: center;
  gap: 5px;
  width: 100%;
  min-height: 105px;
  padding: 5px;
  background: linear-gradient(#242a2d,#171c1f);
  border-radius: 7px;
}

/* Дві круглі кнопки зліва */

.left-buttons {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 7px;
}

.round-button {
  width: 39px;
  height: 39px;
  border-radius: 50%;
  border: 3px solid #4a5256;
  background: linear-gradient(145deg,#111719,#41494d);
  color: #bfc6c8;
  display: grid;
  place-items: center;
  box-shadow: 0 2px 5px #0009,
              inset 0 1px 3px #ffffff18;
}

.round-button svg {
  width: 25px;
  height: 25px;
}

.heating-button {
  cursor: pointer;
  transition: .2s;
}

.heating-button.active {
  color: #42c5a8;
  border-color: #42c5a8;
  box-shadow: 0 0 9px #42c5a855;
}

.heating-button:active {
  transform: scale(.94);
}

/* Три широкі клавіші */

.main-buttons {
  display: grid;
  grid-template-columns: repeat(3,minmax(0,1fr));
  gap: 3px;
  height: 75px;
}

.rocker {
  border: 1px solid #101517;
  border-radius: 4px;
  background: linear-gradient(90deg,#151a1d,#353b3e 50%,#151a1d);
  display: grid;
  place-items: center;
  color: #c1c7c9;
  box-shadow: inset 0 2px 4px #ffffff0b,
              inset 0 -3px 5px #0009;
}

.rocker svg {
  width: 35px;
  height: 45px;
}

/* Вертикальна кнопка */

.vertical-button {
  height: 70px;
  border: 2px solid #4a5256;
  border-radius: 9px;
  background: linear-gradient(90deg,#151a1d,#343a3e,#151a1d);
  display: grid;
  place-items: center;
  color: #c1c7c9;
}

.vertical-button svg {
  width: 24px;
  height: 42px;
}

/* Три маленькі клавіші справа */

.right-buttons {
  height: 66px;
  display: grid;
  grid-template-columns: repeat(3,minmax(0,1fr));
  gap: 2px;
}

.small-rocker {
  border: 1px solid #111719;
  border-radius: 3px;
  background: linear-gradient(90deg,#151a1d,#343a3e,#151a1d);
  color: #c1c7c9;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-size: 15px;
}

.small-rocker svg {
  width: 18px;
  height: 29px;
}

/* Інформація */

.info {
  margin-top: 28px;
  padding: 20px;
  background: #202629;
  border-radius: 15px;
}

.info-row {
  display: flex;
  justify-content: space-between;
  margin-bottom: 17px;
  font-size: 13px;
}

.info-row:last-child { margin-bottom: 0; }

.info-label { color: #92999d; }
.info-value { font-weight: bold; }

#statusValue.active { color: #42c5a8; }

footer {
  text-align: center;
  margin-top: 45px;
  color: #687477;
  font-size: 11px;
  letter-spacing: 2px;
}
</style>
</head>

<body>
<div class="container">

<header>
  <div class="logo">CONTINERA</div>
  <div class="connection">CONNECTED</div>
</header>

<h1>SEAT HEATING</h1>
<div class="subtitle">DAF XG+ · DRIVER SEAT</div>

<div class="panel-frame">
  <div class="panel">

    <!-- ЛІВА КОЛОНКА: ВЕНТИЛЯЦІЯ І ПІДІГРІВ -->
    <div class="left-buttons">

      <div class="round-button" aria-label="Seat ventilation">
        <svg viewBox="0 0 40 40" fill="none"
             stroke="currentColor" stroke-width="2">
          <path d="M10 25h22l-5-13H13v13Z"/>
          <path d="M14 9c-4-4 2-5 0-8"/>
          <path d="M21 9c-4-4 2-5 0-8"/>
          <path d="M28 9c-4-4 2-5 0-8"/>
        </svg>
      </div>

      <button class="round-button heating-button"
              id="heaterButton"
              aria-label="Seat heating"
              type="button">
        <svg viewBox="0 0 40 40" fill="none"
             stroke="currentColor" stroke-width="2.3"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 21V10h10v11"/>
          <path d="M12 21h13l5 12H9v-5q0-5 3-7Z"/>
          <path d="M16 26h10"/>
          <path d="M8 10c-3-3 2-4 0-7"/>
          <path d="M20 8c-3-3 2-4 0-7"/>
          <path d="M32 10c-3-3 2-4 0-7"/>
        </svg>
      </button>

    </div>

    <!-- ТРИ ЦЕНТРАЛЬНІ КЛАВІШІ -->
    <div class="main-buttons">

      <div class="rocker">
        <svg viewBox="0 0 50 60" fill="none"
             stroke="currentColor" stroke-width="2">
          <path d="M17 37V10l9-3v30H17Z"/>
          <path d="M8 42h30v8H8z"/>
          <path d="M40 42l-5 5 5 5"/>
        </svg>
      </div>

      <div class="rocker">
        <svg viewBox="0 0 50 60" fill="none"
             stroke="currentColor" stroke-width="2">
          <path d="M29 8v30l-9 3V11l9-3Z"/>
          <path d="M6 43h30v8H6z"/>
          <path d="M8 12l-4 4 4 4"/>
          <path d="M8 23l-4 4 4 4"/>
        </svg>
      </div>

      <div class="rocker">
        <svg viewBox="0 0 50 60" fill="none"
             stroke="currentColor" stroke-width="2">
          <path d="M17 8v30l9 3V11l-9-3Z"/>
          <path d="M8 43h30v8H8z"/>
          <path d="M40 12l4 4-4 4"/>
          <path d="M40 23l4 4-4 4"/>
        </svg>
      </div>

    </div>

    <!-- ВЕРТИКАЛЬНА КЛАВІША -->
    <div class="vertical-button">
      <svg viewBox="0 0 35 60" fill="none"
           stroke="currentColor" stroke-width="2">
        <path d="M10 39V12l14-5v32H10Z"/>
        <path d="M7 43h24"/>
        <path d="M12 49h12"/>
      </svg>
    </div>

    <!-- ТРИ КЛАВІШІ СПРАВА -->
    <div class="right-buttons">

      <div class="small-rocker">
        +
        <svg viewBox="0 0 30 40" fill="none"
             stroke="currentColor" stroke-width="2">
          <rect x="7" y="3" width="16" height="29" rx="2"/>
          <path d="M7 23h16"/>
        </svg>
      </div>

      <div class="small-rocker">
        +
        <svg viewBox="0 0 30 40" fill="none"
             stroke="currentColor" stroke-width="2">
          <rect x="7" y="3" width="16" height="29" rx="2"/>
          <path d="M7 23h16"/>
        </svg>
      </div>

      <div class="small-rocker">
        +
        <svg viewBox="0 0 30 40" fill="none"
             stroke="currentColor" stroke-width="2">
          <rect x="7" y="3" width="16" height="29" rx="2"/>
          <path d="M7 23h16"/>
        </svg>
      </div>

    </div>

  </div>
</div>

<div class="info">

  <div class="info-row">
    <span class="info-label">HEATING STATUS</span>
    <span class="info-value" id="statusValue">INACTIVE</span>
  </div>

  <div class="info-row">
    <span class="info-label">CONTROL</span>
    <span class="info-value">DRIVER SEAT</span>
  </div>

</div>

<footer>CONTINERA SYSTEMS</footer>

</div>

<script>
const heaterButton = document.getElementById("heaterButton");
const statusValue = document.getElementById("statusValue");

let heatingActive =
  localStorage.getItem("contineraSeatHeating") === "true";

function updateHeating() {
  heaterButton.classList.toggle("active", heatingActive);

  statusValue.textContent =
    heatingActive ? "ACTIVE" : "INACTIVE";

  statusValue.classList.toggle("active", heatingActive);

  localStorage.setItem(
    "contineraSeatHeating",
    String(heatingActive)
  );
}

heaterButton.addEventListener("click", () => {
  heatingActive = !heatingActive;
  updateHeating();
});

updateHeating();
</script>

</body>
</html>
