
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111315">
<title>Continera Seat Control</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px;
  background: #111315;
  color: #e8e8e8;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 520px;
  margin: auto;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 45px;
}

.logo {
  font-size: 19px;
  font-weight: bold;
  letter-spacing: 2px;
}

.connection {
  color: #42c5a8;
  border: 1px solid #286b5d;
  padding: 6px 10px;
  border-radius: 20px;
  font-size: 11px;
}

h1 {
  text-align: center;
  font-size: 24px;
  letter-spacing: 2px;
  margin-bottom: 8px;
}

.subtitle {
  text-align: center;
  color: #92999d;
  font-size: 12px;
  letter-spacing: 2px;
  margin-bottom: 30px;
}

/* Панель */

.panel-frame {
  width: 100%;
  padding: 12px 7px;
  border-radius: 12px;
  background: linear-gradient(145deg,#343a3d,#171c1f);
  box-shadow: 0 12px 30px #0008;
}

.panel {
  display: grid;
  grid-template-columns: 48px minmax(0,1fr) 38px 83px;
  align-items: center;
  gap: 5px;
  width: 100%;
  min-height: 105px;
  padding: 5px;
  background: linear-gradient(#242a2d,#171c1f);
  border-radius: 7px;
}

/* Загальні кнопки */

button {
  font: inherit;
  -webkit-tap-highlight-color: transparent;
}

button:focus-visible {
  outline: 2px solid #42c5a8;
  outline-offset: 3px;
}

.left-buttons {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 7px;
}

.round-button {
  width: 39px;
  height: 39px;
  border-radius: 50%;
  border: 3px solid #4a5256;
  background: linear-gradient(145deg,#111719,#41494d);
  color: #bfc6c8;
  display: grid;
  place-items: center;
  box-shadow: 0 2px 5px #0009,
              inset 0 1px 3px #ffffff18;
  cursor: pointer;
}

.round-button svg {
  width: 25px;
  height: 25px;
}

.round-button.active {
  color: #42c5a8;
  border-color: #42c5a8;
  box-shadow: 0 0 9px #42c5a855;
}

/* Центральні клавіші */

.main-buttons {
  display: grid;
  grid-template-columns: repeat(3,minmax(0,1fr));
  gap: 3px;
  height: 75px;
}

.rocker {
  border: 1px solid #101517;
  border-radius: 4px;
  background: linear-gradient(90deg,#151a1d,#353b3e 50%,#151a1d);
  display: grid;
  grid-template-rows: 1fr 1fr;
  color: #c1c7c9;
  box-shadow: inset 0 2px 4px #ffffff0b,
              inset 0 -3px 5px #0009;
  overflow: hidden;
  padding: 0;
}

.rocker-part {
  display: grid;
  place-items: center;
  cursor: pointer;
  min-height: 0;
}

.rocker-part:first-child {
  border-bottom: 1px solid #59616555;
}

.rocker-part:active,
.small-part:active {
  background: #42c5a833;
}

.rocker svg {
  width: 25px;
  height: 24px;
}

/* Вертикальна клавіша */

.vertical-button {
  height: 70px;
  border: 2px solid #4a5256;
  border-radius: 9px;
  background: linear-gradient(90deg,#151a1d,#343a3e,#151a1d);
  display: grid;
  grid-template-rows: 1fr 1fr;
  color: #c1c7c9;
  overflow: hidden;
  padding: 0;
}

.vertical-part {
  display: grid;
  place-items: center;
  cursor: pointer;
}

.vertical-part:first-child {
  border-bottom: 1px solid #59616555;
}

.vertical-part:active {
  background: #42c5a833;
}

.vertical-button svg {
  width: 22px;
  height: 23px;
}

/* Праві клавіші */

.right-buttons {
  height: 66px;
  display: grid;
  grid-template-columns: repeat(3,minmax(0,1fr));
  gap: 2px;
}

.small-rocker {
  border: 1px solid #111719;
  border-radius: 3px;
  background: linear-gradient(90deg,#151a1d,#343a3e,#151a1d);
  color: #c1c7c9;
  display: grid;
  grid-template-rows: 1fr 1fr;
  overflow: hidden;
}

.small-part {
  display: grid;
  place-items: center;
  cursor: pointer;
  font-size: 15px;
  font-weight: bold;
}

.small-part:first-child {
  border-bottom: 1px solid #59616555;
}

.small-part:active {
  background: #42c5a833;
}

/* Стан і показники */

.info {
  margin-top: 28px;
  padding: 20px;
  background: #202629;
  border-radius: 15px;
}

.section-title {
  color: #92999d;
  font-size: 11px;
  letter-spacing: 1.5px;
  margin-bottom: 17px;
}

.info-row {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 17px;
  font-size: 13px;
}

.info-row:last-child { margin-bottom: 0; }

.info-label { color: #92999d; }

.info-value {
  font-weight: bold;
  text-align: right;
}

.active-value { color: #42c5a8; }

footer {
  text-align: center;
  margin-top: 45px;
  color: #687477;
  font-size: 11px;
  letter-spacing: 2px;
}
</style>
</head>

<body>
<div class="container">

<header>
  <div class="logo">CONTINERA</div>
  <div class="connection">CONNECTED</div>
</header>

<h1>SEAT CONTROL</h1>
<div class="subtitle">DAF XG+ · DRIVER SEAT</div>

<div class="panel-frame">
<div class="panel">

  <!-- Вентиляція і підігрів -->
  <div class="left-buttons">

    <button class="round-button" id="ventButton"
            type="button" aria-label="Ventilation">
      <svg viewBox="0 0 40 40" fill="none"
           stroke="currentColor" stroke-width="2">
        <path d="M10 25h22l-5-13H13v13Z"/>
        <path d="M14 9c-4-4 2-5 0-8"/>
        <path d="M21 9c-4-4 2-5 0-8"/>
        <path d="M28 9c-4-4 2-5 0-8"/>
      </svg>
    </button>

    <button class="round-button" id="heaterButton"
            type="button" aria-label="Heating">
      <svg viewBox="0 0 40 40" fill="none"
           stroke="currentColor" stroke-width="2.3"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 21V10h10v11"/>
        <path d="M12 21h13l5 12H9v-5q0-5 3-7Z"/>
        <path d="M16 26h10"/>
        <path d="M8 10c-3-3 2-4 0-7"/>
        <path d="M20 8c-3-3 2-4 0-7"/>
        <path d="M32 10c-3-3 2-4 0-7"/>
      </svg>
    </button>

  </div>

  <!-- Три центральні клавіші -->
  <div class="main-buttons">

    <div class="rocker">
      <button class="rocker-part" data-control="position"
              data-direction="up" aria-label="Move seat forward">
        <svg viewBox="0 0 40 30" fill="none"
             stroke="currentColor" stroke-width="2">
          <path d="M8 20h23M24 13l7 7-7 7"/>
        </svg>
      </button>
      <button class="rocker-part" data-control="position"
              data-direction="down" aria-label="Move seat backward">
        <svg viewBox="0 0 40 30" fill="none"
             stroke="currentColor" stroke-width="2">
          <path d="M31 10H8m7-7-7 7 7 7"/>
        </svg>
      </button>
    </div>

    <div class="rocker">
      <button class="rocker-part" data-control="backrest"
              data-direction="up" aria-label="Recline backrest">
        <svg viewBox="0 0 40 30" fill="none"
             stroke="currentColor" stroke-width="2">
          <path d="M12 25V5l13 4v16"/>
          <path d="M8 25h25"/>
        </svg>
      </button>
      <button class="rocker-part" data-control="backrest"
              data-direction="down" aria-label="Straighten backrest">
        <svg viewBox="0 0 40 30" fill="none"
             stroke="currentColor" stroke-width="2">
          <path d="M12 5v20l13-4V5"/>
          <path d="M8 25h25"/>
        </svg>
      </button>
    </div>

    <div class="rocker">
      <button class="rocker-part" data-control="height"
              data-direction="up" aria-label="Raise seat">
        <svg viewBox="0 0 40 30" fill="none"
             stroke="currentColor" stroke-width="2">
          <path d="M20 25V5m-7 7 7-7 7 7"/>
        </svg>
      </button>
      <button class="rocker-part" data-control="height"
              data-direction="down" aria-label="Lower seat">
        <svg viewBox="0 0 40 30" fill="none"
             stroke="currentColor" stroke-width="2">
          <path d="M20 5v20m-7-7 7 7 7-7"/>
        </svg>
      </button>
    </div>

  </div>

  <!-- Поперекова підтримка -->
  <div class="vertical-button">
    <button class="vertical-part" data-control="lumbar"
            data-direction="up" aria-label="Increase lumbar support">
      <svg viewBox="0 0 35 30" fill="none"
           stroke="currentColor" stroke-width="2">
        <path d="M17 25V5m-7 7 7-7 7 7"/>
      </svg>
    </button>
    <button class="vertical-part" data-control="lumbar"
            data-direction="down" aria-label="Decrease lumbar support">
      <svg viewBox="0 0 35 30" fill="none"
           stroke="currentColor" stroke-width="2">
        <path d="M17 5v20m-7-7 7 7 7-7"/>
      </svg>
    </button>
  </div>

  <!-- Додаткові регулятори -->
  <div class="right-buttons">

    <div class="small-rocker">
      <button class="small-part" data-control="sideSupport"
              data-direction="up" aria-label="Increase side support">+</button>
      <button class="small-part" data-control="sideSupport"
              data-direction="down" aria-label="Decrease side support">−</button>
    </div>

    <div class="small-rocker">
      <button class="small-part" data-control="cushion"
              data-direction="up" aria-label="Increase cushion">+</button>
      <button class="small-part" data-control="cushion"
              data-direction="down" aria-label="Decrease cushion">−</button>
    </div>

    <div class="small-rocker">
      <button class="small-part" data-control="support"
              data-direction="up" aria-label="Increase support">+</button>
      <button class="small-part" data-control="support"
              data-direction="down" aria-label="Decrease support">−</button>
    </div>

  </div>

</div>
</div>

<!-- Інформація -->
<div class="info">

  <div class="section-title">SEAT FUNCTIONS</div>

  <div class="info-row">
    <span class="info-label">HEATING</span>
    <span class="info-value" id="heatingStatus">OFF</span>
  </div>

  <div class="info-row">
    <span class="info-label">VENTILATION</span>
    <span class="info-value" id="ventStatus">OFF</span>
  </div>

  <div class="section-title" style="margin-top:25px">
    SEAT POSITION
  </div>

  <div class="info-row">
    <span class="info-label">FORWARD / BACKWARD</span>
    <span class="info-value" id="positionValue">50%</span>
  </div>

  <div class="info-row">
    <span class="info-label">BACKREST ANGLE</span>
    <span class="info-value" id="backrestValue">50%</span>
  </div>

  <div class="info-row">
    <span class="info-label">SEAT HEIGHT</span>
    <span class="info-value" id="heightValue">50%</span>
  </div>

  <div class="info-row">
    <span class="info-label">LUMBAR SUPPORT</span>
    <span class="info-value" id="lumbarValue">50%</span>
  </div>

  <div class="info-row">
    <span class="info-label">SIDE SUPPORT</span>
    <span class="info-value" id="sideSupportValue">50%</span>
  </div>

  <div class="info-row">
    <span class="info-label">CUSHION</span>
    <span class="info-value" id="cushionValue">50%</span>
  </div>

  <div class="info-row">
    <span class="info-label">ADDITIONAL SUPPORT</span>
    <span class="info-value" id="supportValue">50%</span>
  </div>

</div>

<footer>CONTINERA SYSTEMS</footer>

</div>

<script>
const STORAGE_KEY = "contineraSeatControl";

const defaults = {
  heating: false,
  ventilation: false,
  position: 50,
  backrest: 50,
  height: 50,
  lumbar: 50,
  sideSupport: 50,
  cushion: 50,
  support: 50
};

let state = { ...defaults };

try {
  const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));

  if (saved && typeof saved === "object") {
    state = { ...defaults, ...saved };
  }
} catch (error) {
  state = { ...defaults };
}

const controls = {
  position: "positionValue",
  backrest: "backrestValue",
  height: "heightValue",
  lumbar: "lumbarValue",
  sideSupport: "sideSupportValue",
  cushion: "cushionValue",
  support: "supportValue"
};

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function render() {
  document.getElementById("heaterButton")
    .classList.toggle("active", state.heating);

  document.getElementById("ventButton")
    .classList.toggle("active", state.ventilation);

  document.getElementById("heatingStatus").textContent =
    state.heating ? "ON" : "OFF";

  document.getElementById("ventStatus").textContent =
    state.ventilation ? "ON" : "OFF";

  document.getElementById("heatingStatus")
    .classList.toggle("active-value", state.heating);

  document.getElementById("ventStatus")
    .classList.toggle("active-value", state.ventilation);

  Object.entries(controls).forEach(([key, elementId]) => {
    document.getElementById(elementId).textContent =
      state[key] + "%";
  });
}

document.getElementById("heaterButton")
  .addEventListener("click", () => {
    state.heating = !state.heating;
    saveState();
    render();
  });

document.getElementById("ventButton")
  .addEventListener("click", () => {
    state.ventilation = !state.ventilation;
    saveState();
    render();
  });

document.querySelectorAll("[data-control]").forEach(button => {
  button.addEventListener("click", () => {
    const control = button.dataset.control;
    const direction = button.dataset.direction;

    if (!(control in controls)) return;

    const step = 5;
    const change = direction === "up" ? step : -step;

    state[control] = Math.max(
      0,
      Math.min(100, state[control] + change)
    );

    saveState();
    render();
  });
});

render();
</script>

</body>
</html>
